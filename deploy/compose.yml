# T2-15 B2b2. 명시한 release 이미지와 미리 검증한 external volume만 쓴다.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-app: &app
  init: true
  user: '10001:10001'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
  stop_grace_period: 20s
  restart: unless-stopped
  pull_policy: never
  logging: *logging
  volumes:
    - type: volume
      source: app-secrets
      target: /run/secrets
      read_only: true

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    pull_policy: never
    user: '70:70'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,mode=3777
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - type: volume
        source: pg-data
        target: /var/lib/postgresql
      - type: volume
        source: pg-secrets
        target: /run/secrets
        read_only: true
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  server:
    <<: *app
    image: ${SERVER_IMAGE:?}
    environment:
      NODE_ENV: production
      SERVER_PORT: '3001'
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?}
      TRUST_PROXY: '1'
      EMAIL_VERIFICATION_REQUIRED: '1'
      MAIL_TRANSPORT: resend
      MAIL_FROM: ${MAIL_FROM:?}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, front]
    # Caddy는 이 namespace의8080/8443만 연다. API3001은 publish하지 않는다.
    ports:
      - '${BIND_ADDRESS:?}:${HTTP_PORT:?}:8080'
      - '${BIND_ADDRESS:?}:${HTTPS_PORT:?}:8443'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then(async r=>{if(!r.ok||(await r.json()).ok!==true)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12

  engine:
    <<: *app
    image: ${ENGINE_IMAGE:?}
    environment:
      NODE_ENV: production
    depends_on:
      server:
        condition: service_healthy
    networks: [backend]

  migrate:
    <<: *app
    image: ${MIGRATE_IMAGE:?}
    profiles: [tools]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    pull_policy: never
    init: true
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    # 공식 binary의 file capability 때문에 bounding set에 이 권한이 필요하다.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /tmp/config
    network_mode: service:server
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./security.caddy
        target: /etc/caddy/security.caddy
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PUBLIC_WEB_DIRECTORY:?}
        target: /srv/web
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: caddy-data
        target: /data
    stop_grace_period: 20s
    restart: unless-stopped
    logging: *logging

networks:
  backend:
    internal: true
  front: {}

volumes:
  app-secrets:
    external: true
    name: ${APP_SECRETS_VOLUME:?}
  pg-secrets:
    external: true
    name: ${PG_SECRETS_VOLUME:?}
  pg-data:
    external: true
    name: ${PG_DATA_VOLUME:?}
  caddy-data:
    external: true
    name: ${CADDY_DATA_VOLUME:?}
