name: Season throughput

on:
  workflow_dispatch:
  push:
    branches: ['wt/t_eba6f2a6']
    paths: ['tools/season-throughput.ts', '.github/workflows/season-throughput.yml']

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://opensamguk:opensamguk@127.0.0.1:5432/opensamguk_season_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opensamguk
          POSTGRES_PASSWORD: opensamguk
          POSTGRES_DB: opensamguk_season_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opensamguk -d opensamguk_season_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - name: Migrate isolated measurement database
        run: DATABASE_URL="$TEST_DATABASE_URL" pnpm db:migrate
      - name: Runner hardware
        run: |
          uname -a
          lscpu
          free -m
      - name: Measure full 1030 DB world
        run: pnpm exec tsx tools/season-throughput.ts | tee season-throughput.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: season-throughput-${{ github.sha }}
          path: season-throughput.jsonl
          if-no-files-found: error
