name: NPC simulation

on:
  push:
    # 필수 검사가 아니고 한 번에 최대 180분을 쓴다. 작업 브랜치 push마다 돌리면 다른 PR의 필수 검사가 실행기를 기다리므로
    # 병합된 뒤 main push에서만 돈다. 브랜치에서 미리 보려면 workflow_dispatch로 돌린다. 태그는 예전처럼 받는다.
    branches: [main]
    tags: ['**']
    paths:
      - 'packages/rules/src/**'
      - 'apps/engine/src/simulation.ts'
      - 'tools/sim/**'
      - 'resources/**'
      - '.github/workflows/simulation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Runner hardware
        run: node --input-type=module -e "import os from 'node:os'; console.log(JSON.stringify({node:process.version,cpu:os.cpus()[0].model,logicalCpus:os.cpus().length,memoryBytes:os.totalmem(),platform:os.platform(),arch:os.arch()}))" | tee hardware.json
      - name: Full ten seeds and determinism
        run: |
          pnpm sim --seeds 10 --output simulation.jsonl
          pnpm sim --seed 1 --repeat --output simulation-repeat.jsonl
          pnpm sim --seed 1 --repeat --convergence off --output simulation-off.jsonl
      - name: Verify complete result set
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def rows(name):
              return [json.loads(line) for line in Path(name).read_text().splitlines()]
          ten = rows('simulation.jsonl')
          repeated = rows('simulation-repeat.jsonl')
          off = rows('simulation-off.jsonl')
          assert len(ten) == 10 and {row['seed'] for row in ten} == {str(i) for i in range(1, 11)}
          assert len(repeated) == len(off) == 2
          for row in ten + repeated + off:
              assert row['scenario'] == '1030' and row['cities'] == 94 and row['generals'] == 491 and row['maxYear'] == 300
              assert 0 < row['seconds'] <= 900 and row['turns'] > 0
              assert row['commandCounts'].get('attack', 0) > 0
              assert row['outcome'] == '통일' and row['winner'] is not None and row['remainingNations'] == 1 or row['outcome'] == '종료연도' and row['winner'] is None and (row['finalYear'], row['finalMonth']) == (300, 12)
          assert all(row['convergence'] for row in ten + repeated)
          assert not any(row['convergence'] for row in off)
          assert ten[0]['stateHash'] == repeated[0]['stateHash'] == repeated[1]['stateHash']
          assert ten[0]['turns'] == repeated[0]['turns'] == repeated[1]['turns']
          assert off[0]['stateHash'] == off[1]['stateHash'] and off[0]['turns'] == off[1]['turns']
          print(json.dumps({'completedSeeds': len(ten), 'repeatOn': True, 'repeatOff': True, 'maximumSeconds': max(row['seconds'] for row in ten + repeated + off)}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: simulation-${{ github.sha }}
          path: |
            simulation*.jsonl
            hardware.json
          if-no-files-found: error
