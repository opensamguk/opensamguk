name: T1-08 format helper
on:
  push:
    branches: [wt/t_b48efcd1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format task files only
        run: git diff --name-only -z origin/main...HEAD -- '*.ts' '*.md' | xargs -0 pnpm exec prettier --write
      - name: Export formatter patch
        run: git diff --binary > formatted.patch
      - uses: actions/upload-artifact@v4
        with:
          name: task-format
          path: formatted.patch
      - run: pnpm generate && pnpm lint && pnpm typecheck && pnpm test
