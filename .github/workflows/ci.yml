name: CI

on:
  # push는 main과 태그만 받는다. 작업 브랜치는 pull_request 실행이 검사하므로 push로 한 번 더 돌리지 않는다.
  # 같은 커밋을 두 번 돌리면 조직의 동시 실행 한도(20개)를 두 배로 써서 다른 PR의 검사가 밀린다.
  # merge queue 임시 브랜치(gh-readonly-queue/**)도 이 목록 밖이라 아래 merge_group 실행만 돈다.
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  # merge queue는 대기열의 병합 결과에 필수 검사(opensamguk-check, opensamguk-database-browser)를 다시 돌린다.
  # 이 이벤트가 없으면 대기열에 들어간 PR이 검사를 기다리다 멈춘다. checkout ref는 github.sha(병합 결과)로 떨어진다.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runtime pins: recheck official Node releases and the Docker Official postgres index in a PR.
  # Update only after opposite-side review and exact-head CI; keep both Node patches identical.
  checks:
    name: opensamguk-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @opensamguk/web build
      - run: pnpm build:public

  # Required check name. Every PG group and E2E shard must pass (cancelled or skipped fails).
  database-browser:
    name: opensamguk-database-browser
    if: always()
    needs: [database-authz, database-engine, database-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every PostgreSQL group and E2E shard
        env:
          AUTHZ: ${{ needs.database-authz.result }}
          ENGINE: ${{ needs.database-engine.result }}
          E2E: ${{ needs.database-e2e.result }}
        run: |
          echo "authz=$AUTHZ engine=$ENGINE e2e=$E2E"
          test "$AUTHZ" = success
          test "$ENGINE" = success
          test "$E2E" = success

  database-authz:
    name: opensamguk-database-authz
    runs-on: ubuntu-24.04
    # PR #314의 30분 작업 취소를 반영한다. 개별 시험의 제한·worker·검사 항목은 유지한다.
    timeout-minutes: 45
    env:
      CI: 'true'
      INTEGRATION_SUITE: api
      DATABASE_URL: postgresql://opensamguk:opensamguk@127.0.0.1:5432/opensamguk_ci_e2e_test
      TEST_DATABASE_URL: postgresql://opensamguk:opensamguk@127.0.0.1:5432/opensamguk_ci_int_test
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: opensamguk
          POSTGRES_PASSWORD: opensamguk
          POSTGRES_DB: opensamguk_ci_e2e_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U opensamguk -d opensamguk_ci_e2e_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bind T2-15 restore inputs
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BIND_PG_SERVICE_ID: ${{ job.services.postgres.id }}
          BIND_PG_ROLE: opensamguk
          BIND_PG_ADMIN_DB: postgres
        run: node tools/ci/t215-binding.mjs prepare
      - run: pnpm test:authz
      - name: Clean T2-15 binding files
        if: always()
        run: node tools/ci/t215-binding.mjs cleanup

  # Slow engine scenarios use a separate PostgreSQL service. No tests or limits are removed.
  database-engine:
    name: opensamguk-database-engine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      INTEGRATION_SUITE: engine
      DATABASE_URL: postgresql://opensamguk:opensamguk@127.0.0.1:5432/opensamguk_ci_e2e_test
      TEST_DATABASE_URL: postgresql://opensamguk:opensamguk@127.0.0.1:5432/opensamguk_ci_int_test
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: opensamguk
          POSTGRES_PASSWORD: opensamguk
          POSTGRES_DB: opensamguk_ci_e2e_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U opensamguk -d opensamguk_ci_e2e_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  # Each shard has its own PostgreSQL service, so shards never share a database.
  # Every spec creates its own world and accounts when missing (e2e/game.ts e2eWorld), so file order across shards does not matter.
  database-e2e:
    name: opensamguk-database-e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    # Worst cold case seen in PR #219: apt download 13m28s + shard 1/4 E2E about 12 min (three 180 s test timeouts) + setup 1.5 min.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: 'true'
      DATABASE_URL: postgresql://opensamguk:opensamguk@127.0.0.1:5432/opensamguk_ci_e2e_test
      SERVER_PORT: '3001'
      APT_ARCHIVES: /home/runner/.cache/playwright-apt
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: opensamguk
          POSTGRES_PASSWORD: opensamguk
          POSTGRES_DB: opensamguk_ci_e2e_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U opensamguk -d opensamguk_ci_e2e_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm db:migrate
      # The slow part of `--with-deps` is downloading .deb files from the Ubuntu mirror
      # (8m52s in job 120378660050, 13m28s in job 120415754413). The browser zip itself downloads in about 1 s.
      # Keep only the downloaded packages (about 25 MB), keyed by Playwright version and runner image.
      # Only pushes to main save it. PR runs restore main's cache, so branch scopes do not keep their own copies.
      - name: Playwright apt cache key
        id: playwright
        run: |
          version="$(pnpm exec playwright --version | awk '{print $2}')"
          echo "key=playwright-apt-$version-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "prefix=playwright-apt-$version-$ImageOS-" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright apt cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright.outputs.key }}
          restore-keys: ${{ steps.playwright.outputs.prefix }}
      - name: Use official Ubuntu archive path
        run: sudo bash tools/ci/ubuntu-archive-path.sh /
      - name: Install Playwright Chromium and system packages
        run: |
          mkdir -p "$APT_ARCHIVES/partial"
          {
            echo "Dir::Cache::Archives \"$APT_ARCHIVES\";"
            echo 'APT::Keep-Downloaded-Packages "true";'
            echo 'Binary::apt-get::APT::Keep-Downloaded-Packages "true";'
          } | sudo tee /etc/apt/apt.conf.d/90playwright-archives
          pnpm exec playwright install --with-deps chromium
          sudo rm -rf "$APT_ARCHIVES/partial" "$APT_ARCHIVES/lock"
          sudo chown -R "$(id -u):$(id -g)" "$APT_ARCHIVES"
          echo "cached debs: $(find "$APT_ARCHIVES" -name '*.deb' | wc -l), $(du -sh "$APT_ARCHIVES" | awk '{print $1}')"
      - name: Save Playwright apt cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright.outputs.key }}
      - run: pnpm e2e --shard=${{ matrix.shard }}/4 --workers=1 --reporter=line
      - name: Build public assets
        run: pnpm build:public
      - name: Check public assets in Chromium
        if: matrix.shard == 1
        run: pnpm e2e:public --reporter=line
      - name: Check required email verification in Chromium
        if: matrix.shard == 1
        run: pnpm e2e:account --reporter=line
      - name: Check current policy and consent in Chromium
        if: matrix.shard == 1
        run: pnpm e2e:legal --reporter=line
      - name: Check account withdrawal in Chromium
        if: matrix.shard == 1
        run: pnpm e2e:withdrawal --reporter=line
      - name: Check admin sanction actions in Chromium
        if: matrix.shard == 1
        run: pnpm e2e:sanction --reporter=line
      - name: Check city resources in public Chromium
        if: matrix.shard == 2
        run: pnpm e2e:city-resources --reporter=line
      - name: Check admin world clock actions in Chromium
        if: matrix.shard == 3
        run: pnpm e2e:admin-clock --reporter=line
      - name: Check admin world end actions in Chromium
        if: matrix.shard == 4
        run: pnpm e2e:admin-end --reporter=line
      - name: Check SAN10 historic and empty maps in public Chromium
        if: matrix.shard == 4
        run: pnpm e2e:san10 --reporter=line
      - name: Check campaign offer fresh reads in Chromium
        if: matrix.shard == 2
        run: pnpm e2e:campaign-offer --reporter=line
      - name: Check admin world creation actions in Chromium
        if: matrix.shard == 1
        run: pnpm e2e:admin-create --reporter=line
      - name: Check admin world reset actions in Chromium
        if: matrix.shard == 1
        run: pnpm e2e:admin-reset --reporter=line
