name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: opensamguk-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @opensamguk/web build

  database-browser:
    name: opensamguk-database-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      DATABASE_URL: postgresql://opensamguk:opensamguk@127.0.0.1:5432/opensamguk_ci_e2e_test
      TEST_DATABASE_URL: postgresql://opensamguk:opensamguk@127.0.0.1:5432/opensamguk_ci_int_test
      SERVER_PORT: '3001'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opensamguk
          POSTGRES_PASSWORD: opensamguk
          POSTGRES_DB: opensamguk_ci_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opensamguk -d opensamguk_ci_e2e_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --workers=1 --reporter=line
        continue-on-error: false
      - name: Upload T1-16 screenshots (QA probe only, not for merge)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t1-16-screens
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 7
          if-no-files-found: warn
      - name: Dump nation history shapes (QA probe only, not for merge)
        if: always()
        run: |
          psql "$DATABASE_URL" -c "SELECT tick, \"nationId\", left(data::text, 160) AS data FROM \"NationHistory\" WHERE NOT (data ? 'cities') ORDER BY tick LIMIT 10;"
          psql "$DATABASE_URL" -c "SELECT count(*) FILTER (WHERE data ? 'cities') AS summary_rows, count(*) FILTER (WHERE NOT (data ? 'cities')) AS events_only_rows FROM \"NationHistory\";"
