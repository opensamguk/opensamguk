name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: opensamguk-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @opensamguk/web build

  database-browser:
    name: opensamguk-database-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      DATABASE_URL: postgresql://opensamguk:opensamguk@127.0.0.1:5432/opensamguk_ci_e2e_test
      TEST_DATABASE_URL: postgresql://opensamguk:opensamguk@127.0.0.1:5432/opensamguk_ci_int_test
      SERVER_PORT: '3001'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opensamguk
          POSTGRES_PASSWORD: opensamguk
          POSTGRES_DB: opensamguk_ci_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opensamguk -d opensamguk_ci_e2e_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --workers=1 --reporter=line
      - name: Capture requested actual progress screens
        if: github.ref == 'refs/heads/qa/owner-progress-20261021-eedd815'
        env:
          OWNER_SNAPSHOT_DIR: ${{ runner.temp }}/owner-progress
          OWNER_WORLD_RESULT: ${{ runner.temp }}/owner-world.jsonl
        shell: bash
        run: |
          set -euo pipefail
          pnpm world:create --scenario 1030 --map che --seed owner-progress-20261021 --turn-term 60 --name '진행 확인 전용 월드' > "$OWNER_WORLD_RESULT"
          WORLD_ID=$(node --input-type=module -e 'import fs from "node:fs";const s=fs.readFileSync(process.env.OWNER_WORLD_RESULT,"utf8").trim().split("\n");console.log(JSON.parse(s.at(-1)).worldId)')
          pnpm world:start --world "$WORLD_ID"
          setsid pnpm dev > "$RUNNER_TEMP/owner-dev.log" 2>&1 &
          OWNED_GROUP=$!
          cleanup() {
            kill -TERM -- "-$OWNED_GROUP" 2>/dev/null || true
            for n in $(seq 1 30); do
              if ! kill -0 -- "-$OWNED_GROUP" 2>/dev/null; then return 0; fi
              sleep 0.2
            done
            kill -KILL -- "-$OWNED_GROUP" 2>/dev/null || true
            wait "$OWNED_GROUP" 2>/dev/null || true
            if kill -0 -- "-$OWNED_GROUP" 2>/dev/null; then echo 'Owned group cleanup failed'; return 1; fi
          }
          trap cleanup EXIT
          for n in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/login >/dev/null; then break; fi
            sleep 1
          done
          node .github/scripts/owner-progress.mjs
          cleanup
          trap - EXIT
          printf '{"ownedProcessGroupExitVerified":true}\n' > "$OWNER_SNAPSHOT_DIR/cleanup.json"
      - name: Upload requested actual progress screens
        if: always() && github.ref == 'refs/heads/qa/owner-progress-20261021-eedd815'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owner-progress-eedd815
          path: ${{ runner.temp }}/owner-progress
          retention-days: 7
          if-no-files-found: error
