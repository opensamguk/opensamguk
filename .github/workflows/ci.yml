name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runtime pins: recheck official Node releases and the Docker Official postgres index in a PR.
  # Update only after opposite-side review and exact-head CI; keep both Node patches identical.
  checks:
    name: opensamguk-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @opensamguk/web build

  database-browser:
    name: opensamguk-database-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      DATABASE_URL: postgresql://opensamguk:opensamguk@127.0.0.1:5432/opensamguk_ci_e2e_test
      TEST_DATABASE_URL: postgresql://opensamguk:opensamguk@127.0.0.1:5432/opensamguk_ci_int_test
      SERVER_PORT: '3001'
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: opensamguk
          POSTGRES_PASSWORD: opensamguk
          POSTGRES_DB: opensamguk_ci_e2e_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U opensamguk -d opensamguk_ci_e2e_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bind T2-15 restore inputs
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BIND_PG_SERVICE_ID: ${{ job.services.postgres.id }}
          BIND_PG_ROLE: opensamguk
          BIND_PG_ADMIN_DB: postgres
        run: node tools/ci/t215-binding.mjs prepare
      - run: pnpm test:authz
      - run: pnpm db:migrate
      - name: Use official Ubuntu archive path
        run: sudo bash tools/ci/ubuntu-archive-path.sh /
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --workers=1 --reporter=line
      - name: Clean T2-15 binding files
        if: always()
        run: node tools/ci/t215-binding.mjs cleanup
