name: Public uptime

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      drill_key:
        description: '연습 키 (ASCII 영숫자·_·- 1~64자, 비우면 운영 확인)'
        required: false
        type: string
        default: ''
      drill_status:
        description: '자기 HTTP 연습 상태 (200 또는 500, drill_key와 함께 입력)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.drill_key != '' || inputs.drill_status != '') && 'uptime-drill' || 'uptime-prod' }}
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check public health and persist decisions
        if: inputs.drill_key == '' && inputs.drill_status == ''
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          UPTIME_STATE_REF: refs/heads/ops/uptime-state
          UPTIME_GIT_REMOTE: https://github.com/${{ github.repository }}.git
          UPTIME_KEY: prod
          UPTIME_GIT_TOKEN: ${{ github.token }}
          OPS_DISCORD_WEBHOOK: ${{ secrets.OPS_DISCORD_WEBHOOK }}
        run: node --import tsx tools/monitor/uptime.ts
      - name: Exercise owned HTTP and persist drill decisions
        if: inputs.drill_key != '' || inputs.drill_status != ''
        env:
          UPTIME_STATE_REF: refs/heads/ops/uptime-state
          UPTIME_GIT_REMOTE: https://github.com/${{ github.repository }}.git
          UPTIME_GIT_TOKEN: ${{ github.token }}
          DRILL_KEY: ${{ inputs.drill_key }}
          DRILL_STATUS: ${{ inputs.drill_status }}
        run: node --import tsx tools/monitor/uptimeDrill.ts
