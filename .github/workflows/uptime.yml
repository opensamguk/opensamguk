name: Public uptime

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime-prod
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check public health and persist decisions
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          UPTIME_STATE_REF: refs/heads/ops/uptime-state
          UPTIME_GIT_REMOTE: https://github.com/${{ github.repository }}.git
          UPTIME_KEY: prod
          UPTIME_GIT_TOKEN: ${{ github.token }}
          OPS_DISCORD_WEBHOOK: ${{ secrets.OPS_DISCORD_WEBHOOK }}
        run: node --import tsx tools/monitor/uptime.ts
